name: JANUS Portal Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'PORTAL_ARCHITECTURE.json'
      - 'PORTAL_ACCOUNT_LEDGER.json'
      - 'PORTAL_API_CONTRACT.json'
      - 'PORTAL_ORGAN_BRIDGE.json'
      - 'tests/test_portal_rewards.py'
      - 'portal_backend/**'
      - 'PORTAL_ACTIVITY_BRIDGE.json'
      - 'PORTAL_GAME_REWARD_BRIDGE.json'
      - 'tests/test_portal_backend_foundation.py'
      - 'PORTAL_TELEGRAM_AUTH.json'
      - 'PORTAL_ACHIEVEMENTS.json'
      - 'PORTAL_REWARD_POLICY.json'
      - 'portal/**'
      - 'index.html'
      - '.github/workflows/janus-portal-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'PORTAL_ARCHITECTURE.json'
      - 'PORTAL_ACCOUNT_LEDGER.json'
      - 'PORTAL_API_CONTRACT.json'
      - 'PORTAL_ORGAN_BRIDGE.json'
      - 'tests/test_portal_rewards.py'
      - 'portal_backend/**'
      - 'PORTAL_ACTIVITY_BRIDGE.json'
      - 'PORTAL_GAME_REWARD_BRIDGE.json'
      - 'tests/test_portal_backend_foundation.py'
      - 'PORTAL_TELEGRAM_AUTH.json'
      - 'PORTAL_ACHIEVEMENTS.json'
      - 'PORTAL_REWARD_POLICY.json'
      - 'portal/**'
      - 'index.html'
      - '.github/workflows/janus-portal-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JSON
        run: |
          python -m json.tool PORTAL_ARCHITECTURE.json >/dev/null
          python -m json.tool PORTAL_ACCOUNT_LEDGER.json >/dev/null
          python -m json.tool PORTAL_API_CONTRACT.json >/dev/null
          python -m json.tool PORTAL_ORGAN_BRIDGE.json >/dev/null
          python -m json.tool PORTAL_REWARD_POLICY.json >/dev/null
          python -m json.tool PORTAL_ACHIEVEMENTS.json >/dev/null
          python -m json.tool PORTAL_ACTIVITY_BRIDGE.json >/dev/null
          python -m json.tool PORTAL_GAME_REWARD_BRIDGE.json >/dev/null
          python -m json.tool PORTAL_TELEGRAM_AUTH.json >/dev/null
          python -m json.tool portal/ecosystem-catalog.json >/dev/null
      - name: Validate portal browser code
        run: |
          node --check portal/portal.js
      - name: Run reward engine tests
        run: |
          PYTHONPATH=. python -m unittest -v tests.test_portal_rewards
      - name: Enforce portal economic and state authority
        run: |
          python - <<'PY'
          import json, pathlib
          a=json.load(open('PORTAL_ARCHITECTURE.json',encoding='utf-8'))
          l=json.load(open('PORTAL_ACCOUNT_LEDGER.json',encoding='utf-8'))
          b=json.load(open('PORTAL_ORGAN_BRIDGE.json',encoding='utf-8'))
          r=json.load(open('PORTAL_REWARD_POLICY.json',encoding='utf-8'))
          ach=json.load(open('PORTAL_ACHIEVEMENTS.json',encoding='utf-8'))
          ab=json.load(open('PORTAL_ACTIVITY_BRIDGE.json',encoding='utf-8'))
          gr=json.load(open('PORTAL_GAME_REWARD_BRIDGE.json',encoding='utf-8'))
          tg=json.load(open('PORTAL_TELEGRAM_AUTH.json',encoding='utf-8'))
          assert a['home_after_login']=='GROUP'
          assert a['economy']['currency']=='JANUS_COIN'
          assert a['economy']['cash_value'] is False
          assert a['economy']['purchasable_with_crypto'] is False
          assert a['economy']['withdrawable'] is False
          assert a['economy']['commercial_market_balance']=='SEPARATE'
          assert a['inventory']['server_authority'] is True
          assert 'GENESIS' in a['economy']['shared_across']
          assert 'HELIOS_SLOT' in a['economy']['shared_across']
          assert l['balances']['JANUS_COIN']['cash_value'] is False
          assert 'CLIENT_CANNOT_SET_BALANCE_DIRECTLY' in l['ledger_rules']
          assert b['organ_policies']['HELIOS']['forbidden'] == ['SET_BALANCE','SET_INVENTORY','REAL_MONEY_WAGER','CASH_OUT']
          js=pathlib.Path('portal/portal.js').read_text(encoding='utf-8')
          assert "localStorage.setItem" not in js
          assert "/api/portal/genesis/turn" in js
          assert "ONE_LOGIN_ONE_PORTAL" in a['principles']
          assert a['progression']['raw_message_count_rewarded'] is False
          assert r['currency']['cash_value'] is False
          assert r['currency']['purchasable_with_crypto'] is False
          assert r['daily_reward']['one_claim_per_account_per_utc_day'] is True
          assert r['anti_abuse']['raw_message_volume_multiplier'] == 0
          assert r['anti_abuse']['bot_activity_default'] == 'NO_REWARD'
          assert ach['duplicate_unlocks_allowed'] is False
          assert ab['event_envelope']['browser_may_submit_directly'] is False
          assert ab['sources']['GROUP_TELEGRAM']['raw_message_count_rewarded'] is False
          assert gr['authority']['client_can_mint'] is False
          assert gr['grants']['PORTAL_DAILY_CHEST']['affects_real_money_odds'] is False
          assert 'REWARD_NE_RNG_WEIGHT' in gr['firewalls']
          assert tg['website_login']['pkce']=='S256_REQUIRED'
          assert tg['website_login']['client_secret_server_side_only'] is True
          assert tg['mini_app_login']['initDataUnsafe_is_authority'] is False
          assert tg['secrets_in_browser'] is False
          print('JANUS_PORTAL_CONTRACT=PASS')
          print('GROUP_DEFAULT_HOME=TRUE')
          print('SERVER_LEDGER_AUTHORITY=TRUE')
          print('REAL_MONEY_SLOT=FALSE')
          print('REWARD_ENGINE=RECEIPT_BOUND')
          print('RAW_MESSAGE_VOLUME_REWARD=FALSE')
          PY
