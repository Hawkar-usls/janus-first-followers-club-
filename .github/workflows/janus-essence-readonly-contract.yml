name: JANUS ESSENCE Read-only Repo Microkernel Contract
on:
  pull_request:
    paths:
      - '.janus/essence/**'
      - 'tests/test_essence_kernel.py'
      - '.github/workflows/janus-essence-readonly-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-repo-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert inert-only six roles, source hash receipts, zero effects
        run: |
          python -m py_compile .janus/essence/kernel.py
          python -m unittest discover -s tests -p 'test_essence_kernel.py' -v
          python .janus/essence/kernel.py --manifest .janus/essence/manifest.json --fixture .janus/essence/fixture.json --allow-readonly --propose-child recovery --out artifacts/essence/receipt.json
          python .janus/essence/kernel.py --verify artifacts/essence/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: essence-readonly-repo-contract
          path: artifacts/essence/receipt.json
          retention-days: 14
